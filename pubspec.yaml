name: lingbi
description: 灵笔 - AI 写作助手桌面应用
publish_to: 'none'
version: 0.6.0

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 编辑器
  flutter_quill: ^11.0.0
  # 文件管理
  path_provider: ^2.1.0
  file_picker: ^8.0.0
  path: ^1.9.0
  # 网络
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  # 状态管理
  provider: ^6.1.0
  # UI
  window_manager: ^0.4.0
  # 工具
  uuid: ^4.3.0
  # 数据库
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  # 导出
  pdf: ^3.11.0
  archive: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.16.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
