name: lingbi
description: 灵笔 - AI 写作助手桌面应用
publish_to: 'none'
version: 0.4.0

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 编辑器
  flutter_quill: ^11.0.0
  # 文件管理
  path_provider: ^2.1.0
  file_picker: ^8.0.0
  path: ^1.9.0
  # 网络
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  # 工具
  uuid: ^4.3.0
  crypto: ^3.0.7
  # 导出
  pdf: ^3.11.0
  # 安全存储
  flutter_secure_storage: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.16.0

flutter:
  uses-material-design: true
