version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  dart_frog: ^1.1.0
  http: ^1.2.0
  path: ^1.9.0
  convert: ^3.1.1
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.0
  rclone_dart: ^1.0.0
  webdav_client: ^1.2.0
  crypto: ^3.0.0
  uuid: ^4.0.0

dev_dependencies:
  dart_frog_lint: ^0.1.0
  mocktail: ^1.0.0
  test: ^1.0.0