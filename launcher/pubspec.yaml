name: launcher
description: 灵笔一键启动器 — 管理所有微服务的桌面 GUI
version: 1.0.1+1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  path: ^1.9.0
  package_info_plus: ^8.1.0
  shared_preferences: ^2.3.0
  window_manager: ^0.4.0
  tray_manager: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.ico
