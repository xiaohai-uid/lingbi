      retries: 3

  sync:
    build:
      context: ../lingbi_server
      dockerfile: Dockerfile.dart
    ports:
      - "8090:8090"
    volumes:
      - lingbi_data:/app/data
    environment:
      - PORT=8090
    networks:
      - lingbi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  canvas:
    build:
      context: ../lingbi_server/microservices/canvas
      dockerfile: ../../docker/Dockerfile.node
    ports:
      - "8091:8091"
    environment:
      - PORT=8091
      - NODE_ENV=production
    networks:
      - lingbi_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8091/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  novel-engine:
    build:
      context: services/novel-engine
      dockerfile: Dockerfile
    ports:
      - "8092:4001"
    volumes:
      - lingbi_data:/app/data
    environment:
      - PORT=4001
      - LITELLM_URL=http://litellm:4000
    networks:
      - lingbi_network
    depends_on:
      - litellm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  quality-review:
    build:
      context: services/quality-review
      dockerfile: Dockerfile
    ports:
      - "8093:4002"
    volumes:
      - lingbi_data:/app/data
    environment:
      - PORT=4002
      - LITELLM_URL=http://litellm:4000
    networks:
      - lingbi_network
    depends_on:
      - litellm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-12345678}
      - DATABASE_URL=sqlite:///app/data/litellm.db
    networks:
      - lingbi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  lingbi_data:

networks:
  lingbi_network:
    driver: bridge