# 灵笔 v4.0 — 全栈 Docker Compose 编排
# 使用: docker compose up -d
# 构建: docker compose build

name: lingbi

services:
  # ========== 基础设施 ==========
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lingbi
      POSTGRES_USER: lingbi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lingbi_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-pg.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - lingbi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingbi"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lingbi_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - lingbi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    volumes:
      - ./docker/litellm_config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_KEY:-sk-lingbi-master}
      - DATABASE_URL=sqlite:///app/data/litellm.db
    networks:
      - lingbi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========== Go 微服务 ==========
  api-gateway:
    build:
      context: ./go/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
    networks:
      - lingbi_network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  project-service:
    build:
      context: ./go/project-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - DB_URL=postgres://lingbi:${DB_PASSWORD:-lingbi_dev}@postgres:5432/lingbi?sslmode=disable
    networks:
      - lingbi_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  document-service:
    build:
      context: ./go/document-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - DB_URL=postgres://lingbi:${DB_PASSWORD:-lingbi_dev}@postgres:5432/lingbi?sslmode=disable
    volumes:
      - doc_data:/app/documents
    networks:
      - lingbi_network
    depends_on:
      postgres:
        condition: service_healthy

  settings-service:
    build:
      context: ./go/settings-service
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
      - REDIS_URL=redis:6379
    networks:
      - lingbi_network
    depends_on:
      redis:
        condition: service_healthy

  export-service:
    build:
      context: ./go/export-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
    volumes:
      - doc_data:/app/documents:ro
    networks:
      - lingbi_network

  quota-service:
    build:
      context: ./go/quota-service
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - REDIS_URL=redis:6379
    networks:
      - lingbi_network
    depends_on:
      redis:
        condition: service_healthy

  sync-service:
    build:
      context: ./go/sync-service
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - DB_URL=postgres://lingbi:${DB_PASSWORD:-lingbi_dev}@postgres:5432/lingbi?sslmode=disable
    volumes:
      - doc_data:/app/documents
    networks:
      - lingbi_network
    depends_on:
      postgres:
        condition: service_healthy

  version-history:
    build:
      context: ./go/version-history
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      - PORT=8086
      - DB_URL=postgres://lingbi:${DB_PASSWORD:-lingbi_dev}@postgres:5432/lingbi?sslmode=disable
    networks:
      - lingbi_network
    depends_on:
      postgres:
        condition: service_healthy

  timeline-service:
    build:
      context: ./go/timeline-service
      dockerfile: Dockerfile
    ports:
      - "8094:8094"
    environment:
      - PORT=8094
      - DB_URL=postgres://lingbi:${DB_PASSWORD:-lingbi_dev}@postgres:5432/lingbi?sslmode=disable
    networks:
      - lingbi_network
    depends_on:
      postgres:
        condition: service_healthy

  faction-service:
    build:
      context: ./go/faction-service
      dockerfile: Dockerfile
    ports:
      - "8095:8095"
    environment:
      - PORT=8095
      - DB_URL=postgres://lingbi:${DB_PASSWORD:-lingbi_dev}@postgres:5432/lingbi?sslmode=disable
    networks:
      - lingbi_network
    depends_on:
      postgres:
        condition: service_healthy

  # ========== Rust 微服务 ==========
  ai-provider:
    build:
      context: ./rust/ai-provider
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - LITELLM_URL=http://litellm:4000
    networks:
      - lingbi_network
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  novel-engine:
    build:
      context: ./rust/novel-engine
      dockerfile: Dockerfile
    ports:
      - "8092:8092"
    environment:
      - PORT=8092
      - AI_PROVIDER_URL=http://ai-provider:8081
    networks:
      - lingbi_network
    depends_on:
      ai-provider:
        condition: service_healthy

  quality-review:
    build:
      context: ./rust/quality-review
      dockerfile: Dockerfile
    ports:
      - "8093:8093"
    environment:
      - PORT=8093
      - AI_PROVIDER_URL=http://ai-provider:8081
    networks:
      - lingbi_network
    depends_on:
      ai-provider:
        condition: service_healthy

  canon-service:
    build:
      context: ./rust/canon-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - QDRANT_URL=http://qdrant:6333
    networks:
      - lingbi_network
    depends_on:
      qdrant:
        condition: service_healthy

  butterfly-analyzer:
    build:
      context: ./rust/butterfly-analyzer
      dockerfile: Dockerfile
    ports:
      - "8096:8096"
    environment:
      - PORT=8096
      - AI_PROVIDER_URL=http://ai-provider:8081
    networks:
      - lingbi_network
    depends_on:
      ai-provider:
        condition: service_healthy

  canvas-service:
    build:
      context: ./rust/canvas-service
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    environment:
      - PORT=8091
    networks:
      - lingbi_network

  storage-service:
    build:
      context: ./rust/storage-service
      dockerfile: Dockerfile
    ports:
      - "8089:8089"
    environment:
      - PORT=8089
      - QDRANT_URL=http://qdrant:6333
    networks:
      - lingbi_network
    depends_on:
      qdrant:
        condition: service_healthy

  model-discovery:
    build:
      context: ./go/model-discovery
      dockerfile: Dockerfile
    ports:
      - "8099:8099"
    environment:
      - PORT=8099
    networks:
      - lingbi_network

  search-service:
    build:
      context: ./go/search-service
      dockerfile: Dockerfile
    ports:
      - "8098:8098"
    environment:
      - PORT=8098
      - REDIS_URL=redis:6379
      - AI_PROVIDER_URL=http://ai-provider:8081
    networks:
      - lingbi_network
    depends_on:
      redis:
        condition: service_healthy
      ai-provider:
        condition: service_healthy

  skill-service:
    build:
      context: ./rust/skill-service
      dockerfile: Dockerfile
    ports:
      - "8097:8097"
    environment:
      - PORT=8097
      - DATABASE_URL=postgres://lingbi:lingbi@postgres:5432/lingbi
      - AI_PROVIDER_URL=http://ai-provider:8081
    networks:
      - lingbi_network
    depends_on:
      postgres:
        condition: service_healthy
      ai-provider:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  qdrant_data:
  doc_data:

networks:
  lingbi_network:
    driver: bridge