version: '3.8'

services:
  lingbi-dev:
    build:
      context: .
      target: dev
    container_name: lingbi-dev
    volumes:
      - .:/app
      - flutter-cache:/opt/flutter/.pub-cache
    working_dir: /app
    environment:
      # API Keys — 通过 .env 文件或宿主机环境变量传入
      # 复制 .env.example 为 .env 并填入你的 key
      - SENSENOVA_API_KEY=${SENSENOVA_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
    command: flutter test

  lingbi-analyze:
    build:
      context: .
      target: builder
    container_name: lingbi-analyze
    volumes:
      - .:/app
    working_dir: /app
    command: flutter analyze lib/

volumes:
  flutter-cache: