services:
  api-gateway:
    build:
      context: ../lingbi_server
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    volumes:
      - lingbi_data:/app/data
    environment:
      - DART_FROG_DEBUG=false
    networks:
      - lingbi_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ai-provider:
    build:
      context: ../lingbi_server
      dockerfile: Dockerfile.dart
    ports:
      - "8081:8081"
    volumes:
      - lingbi_data:/app/data
    environment:
      - PORT=8081
      - LITELLM_API_URL=http://litellm:4000
    networks:
      - lingbi_network
    depends_on:
      - litellm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  project:
    build:
      context: ../lingbi_server
      dockerfile: Dockerfile.dart
    ports:
      - "8082:8082"
    volumes:
      - lingbi_data:/app/data
    environment:
      - PORT=8082
    networks:
      - lingbi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  document:
    build:
      context: ../lingbi_server
      dockerfile: Dockerfile.dart
    ports:
      - "8083:8083"
    volumes:
      - lingbi_data:/app/data
    environment:
      - PORT=8083
    networks:
      - lingbi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  codex:
    build:
      context: ../lingbi_server
      dockerfile: Dockerfile.dart
    ports:
      - "8084:8084"
    volumes:
      - lingbi_data:/app/data
    environment:
      - PORT=8084
    networks:
      - lingbi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  export:
    build:
      context: ../lingbi_server
      dockerfile: Dockerfile.dart
    ports:
      - "8085:8085"
    volumes:
      - lingbi_data:/app/data
    environment:
      - PORT=8085
    networks:
      - lingbi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  version:
    build:
      context: ../lingbi_server
      dockerfile: Dockerfile.dart
    ports:
      - "8086:8086"
    volumes:
      - lingbi_data:/app/data
    environment:
      - PORT=8086
    networks:
      - lingbi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  settings:
    build:
      context: ../lingbi_server/microservices/settings
      dockerfile: ../../docker/Dockerfile.node
    ports:
      - "8087:8087"
    volumes:
      - lingbi_data:/app/data
    environment:
      - PORT=8087
      - NODE_ENV=production
    networks:
      - lingbi_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8087/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  quota:
    build:
      context: ../lingbi_server
      dockerfile: Dockerfile.dart
    ports:
      - "8088:8088"
    volumes:
      - lingbi_data:/app/data
