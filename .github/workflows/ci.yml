name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze lib/

      - name: Run tests
        run: flutter test

  build:
    needs: analyze-and-test
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package release with checksums and provenance
        shell: powershell
        run: tool/windows/package_release.ps1 -SkipBuild

      - name: Verify release evidence
        shell: powershell
        run: |
          Get-Item build/windows/release-package/SHA256SUMS.txt
          Get-Item build/windows/release-package/PROVENANCE.json

      - name: Upload packaged artifact and evidence
        uses: actions/upload-artifact@v4
        with:
          name: lingbi-windows-${{ github.sha }}
          path: build/windows/release-package/
          if-no-files-found: error
