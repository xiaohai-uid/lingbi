name: Lingbi v4.0 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  GO_VERSION: '1.24'
  RUST_VERSION: '1.85'

jobs:
  flutter-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze lib/ --no-fatal-infos
      - run: flutter test test/*_test.dart --no-pub --reporter expanded

  # ===== Go 微服务 =====
  go-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, project-service, document-service, settings-service, export-service, quota-service, sync-service, version-history, timeline-service, faction-service]
    defaults:
      run:
        working-directory: go/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/${{ matrix.service }}/go.sum
      - run: go build ./cmd/server
      - run: go vet ./...
      - run: go test ./... -v -count=1

  # ===== Rust 微服务 =====
  rust-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ai-provider, novel-engine, quality-review, canon-service, butterfly-analyzer, canvas-service, storage-service]
    defaults:
      run:
        working-directory: rust/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: cargo build --release
      - run: cargo clippy -- -D warnings
      - run: cargo test

  # ===== Protobuf 校验 =====
  protobuf-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint protos/
      - run: buf breaking protos/ --against https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }}

  # ===== Docker 镜像构建 =====
  docker-build:
    runs-on: ubuntu-latest
    needs: [go-build, rust-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [api-gateway, project-service, ai-provider, novel-engine]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ startsWith(matrix.service, 'ai') || startsWith(matrix.service, 'novel') || startsWith(matrix.service, 'quality') || startsWith(matrix.service, 'canon') || startsWith(matrix.service, 'butterfly') || startsWith(matrix.service, 'canvas') || startsWith(matrix.service, 'storage') && 'rust' || 'go' }}/${{ matrix.service }}
          file: ./docker/${{ startsWith(matrix.service, 'ai') || startsWith(matrix.service, 'novel') || startsWith(matrix.service, 'quality') || startsWith(matrix.service, 'canon') || startsWith(matrix.service, 'butterfly') || startsWith(matrix.service, 'canvas') || startsWith(matrix.service, 'storage') && 'Dockerfile.rust' || 'Dockerfile.go' }}
          push: true
          tags: ghcr.io/xiaohai-uid/lingbi-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== E2E 集成测试 =====
  e2e:
    runs-on: ubuntu-latest
    needs: [protobuf-check]
    steps:
      - uses: actions/checkout@v4
      - name: Start all services
        run: docker compose -f docker-compose.yml up -d --wait --wait-timeout 120
      - name: Run integration tests
        run: |
          # Health check
          for port in 8080 8081 8082 8083; do
            curl -sf http://localhost:$port/health || (echo "Service :$port failed" && exit 1)
          done
          echo "All services healthy"
      - name: Shutdown
        run: docker compose -f docker-compose.yml down -v