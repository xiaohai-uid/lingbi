name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze code
        run: flutter analyze lib/

      - name: Run tests
        run: flutter test

  build:
    needs: analyze-and-test
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - uses: dtolnay/rust-toolchain@stable

      - name: Checkout Rust core
        uses: actions/checkout@v4
        with:
          repository: xiaohai-uid/lingbi-next
          path: lingbi-next
          ref: 994889a97c2c742cde8cc23b541583fc6cc0b1ca

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows
        env:
          LINGBI_RUST_CRATE_DIR: ${{ github.workspace }}/lingbi-next/crates/lingbi-ffi
        run: flutter build windows --release

      - name: Package release with checksums and provenance
        shell: powershell
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "lingbi-release-package"
          tool/windows/package_release.ps1 -SkipBuild -OutputDir $packageDir
          "LINGBI_PACKAGE_DIR=$packageDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify release evidence
        shell: powershell
        run: |
          Get-Item "$env:LINGBI_PACKAGE_DIR/SHA256SUMS.txt"
          Get-Item "$env:LINGBI_PACKAGE_DIR/PROVENANCE.json"

      - name: Upload packaged artifact and evidence
        uses: actions/upload-artifact@v4
        with:
          name: lingbi-windows-${{ github.sha }}
          path: ${{ env.LINGBI_PACKAGE_DIR }}/
          if-no-files-found: error

  # Windows Flutter ↔ Rust FFI Gate (Task 16):
  #   checkout lingbi + pinned lingbi-next → build lingbi-ffi Windows DLL →
  #   set LINGBI_FFI_DLL → run Flutter FFI tests EXPLICITLY.
  # Requirement: FFI passed > 0, failed = 0, skipped = 0.
  # A skip here (LINGBI_FFI_DLL 未设置) is a hard FAIL, never a pass.
  ffi-gate:
    name: Windows Flutter↔Rust FFI Gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - uses: dtolnay/rust-toolchain@stable

      - name: Checkout pinned Rust core
        uses: actions/checkout@v4
        with:
          repository: xiaohai-uid/lingbi-next
          path: lingbi-next
          ref: 994889a97c2c742cde8cc23b541583fc6cc0b1ca

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build lingbi-ffi Windows DLL
        shell: pwsh
        run: |
          # lingbi-ffi is a workspace member; artifacts land in the
          # workspace target dir at the repo root.
          cargo build --release -p lingbi-ffi --manifest-path lingbi-next/Cargo.toml
          $dll = Join-Path (Get-Location) 'lingbi-next/target/release/lingbi_ffi.dll'
          if (-not (Test-Path $dll)) {
            Write-Host "lingbi_ffi.dll was not produced at $dll"
            exit 1
          }
          "LINGBI_FFI_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Flutter FFI tests (explicit, never skipped)
        shell: pwsh
        run: |
          if (-not $env:LINGBI_FFI_DLL) {
            Write-Host "FFI Gate = FAIL: LINGBI_FFI_DLL not set"
            exit 1
          }
          $output = flutter test test/rust_ffi_project_parser_test.dart test/rust_ffi_document_storage_test.dart --dart-define=LINGBI_FFI_DLL=$env:LINGBI_FFI_DLL 2>&1
          $output | Select-Object -Last 50
          $summary = ($output | Select-String 'All tests passed!|Some tests failed.' | Select-Object -Last 1).Line
          Write-Host "FFI summary: $summary"
          $passed = 0; $failed = 0; $skipped = 0
          if ($summary -match '\+(\d+)') { $passed = [int]$matches[1] }
          if ($summary -match '~(\d+)') { $skipped = [int]$matches[1] }
          if ($summary -match '-(\d+)') { $failed = [int]$matches[1] }
          Write-Host "FFI passed=$passed failed=$failed skipped=$skipped"
          if ($passed -lt 1 -or $failed -ne 0 -or $skipped -ne 0) {
            Write-Host "FFI Gate = FAIL (need passed > 0, failed = 0, skipped = 0)"
            exit 1
          }
          Write-Host "FFI Gate = PASS"
