# 奇幻类型写作指南
# 基于桑德森三定律 + 网文奇幻创作方法论

name: 奇幻
slug: fantasy

# 核心原则
principles:
  - name: 桑德森第一定律
    description: 作者解决冲突的能力与读者对魔法系统的理解程度成正比
    apply: 设定清晰的魔法/修炼规则，让读者理解角色如何用能力解决问题

  - name: 桑德森第二定律
    description: 限制比能力更有趣
    apply: 给主角的 KPI 设置代价和限制，而不是无限开挂

  - name: 桑德森第三定律
    description: 在已有系统之上扩展，而不是推翻它
    apply: 在已有设定基础上增加深度，不要频繁吃书

# 世界构建检查清单
worldbuilding_checklist:
  - 力量体系（修炼等级/魔法体系）
  - 势力分布（宗门/国家/家族）
  - 地理环境（大陆地图/气候）
  - 历史脉络（上古秘辛/近代事件）
  - 经济体系（货币/资源）
  - 社会结构（阶层/制度）

# 网文奇幻子类型
subgenres:
  - name: 玄幻修仙
    keywords: [修炼, 飞升, 炼丹, 法宝, 境界]
    hook_types: [打脸, 升级, 夺宝]
  - name: 西式奇幻
    keywords: [魔法, 龙, 骑士, 精灵, 地下城]
    hook_types: [冒险, 探索, 战斗]
  - name: 东方玄幻
    keywords: [武道, 血脉, 神兵, 帝族, 秘境]
    hook_types: [逆袭, 复仇, 争霸]

# 开篇建议
opening_tips:
  - 前三章展示金手指/金手指线索
  - 第一章结尾要有悬念钩子
  - 尽快建立核心冲突
  - 避免大段世界观说明