# 灵笔 Prompt 模板库
# Novel Writing Prompts
# v1.0.0 - 2026-07-18

# =============================================
# 创意展开 (expand_idea)
# =============================================
- id: expand_idea
  name: 创意展开
  description: 将用户创意展开为故事梗概
  template: |
    你是一位专业的小说创作顾问。请根据以下创意展开为完整的故事梗概。

    【创意】{{idea}}
    【类型】{{genre}}
    【风格】{{style}}

    请输出：
    1. 故事背景设定（世界观、时代、核心规则）
    2. 核心角色设定（主角、重要配角各 2-3 个）
    3. 故事梗概（500-1000 字）
    4. 核心主题（2-3 个）
    
    要求：梗概要有明确的起承转合结构。

# =============================================
# 风格分析 (style_analysis)
# =============================================
- id: style_analysis
  name: 风格分析
  description: 分析文本的写作风格特征
  template: |
    请分析以下文本的写作风格特征：

    {{text}}

    请评估以下维度（每项评分 1-10）：
    1. 用词丰富度
    2. 句式变化
    3. 节奏把控
    4. 氛围营造
    5. 对话自然度

    并总结 3-5 个核心风格特征。

# =============================================
# 小说拆解 (novel_analysis)
# =============================================
- id: novel_analysis
  name: 小说拆解
  description: 分析小说文本的结构和元素
  template: |
    请分析以下小说文本的结构和创作元素：

    {{text}}

    请识别：
    1. 出场角色及其定位
    2. 章节结构
    3. 情节弧线
    4. 核心冲突
    5. 主题表达
    6. 爽点/高潮分布

# =============================================
# 梗概生成 (generate_synopsis)
# =============================================
- id: generate_synopsis
  name: 梗概生成 (Layer 1)
  description: 从创意生成故事梗概
  template: |
    你是一位擅长创作{{genre}}类型小说的作家。请基于以下创意，生成一个完整的故事梗概和核心角色设定。

    创意：{{idea}}
    风格要求：{{style_description}}

    请用中文输出以下结构：
    【故事梗概】（500-800字）
    【核心角色】（每个角色包含：名字、定位、性格、背景）
    【世界观设定】（时代背景、核心规则）
    【主题】（2-3个核心主题）

# =============================================
# 细纲展开 (expand_outline)
# =============================================
- id: expand_outline
  name: 细纲展开 (Layer 2)
  description: 将梗概展开为章节细纲
  template: |
    你是一位{{genre}}类型小说的签约作者。请基于以下故事梗概，展开为详细的卷/章细纲。

    梗概：{{synopsis}}
    世界观：{{setting}}
    核心角色：{{characters}}
    主题：{{themes}}

    请为 {{numVolumes}} 卷 × {{numChaptersPerVolume}} 章的结构生成细纲。
    每章需包含：
    - 章节标题
    - 本章概要（100-150字）
    - 主要出场角色
    - 3-5 个场景描述

    要求：每章结尾要有钩子（悬念/期待感），保持读者追读欲望。

# =============================================
# 正文生成 (generate_scene)
# =============================================
- id: generate_scene
  name: 正文生成 (Layer 3)
  description: 根据场景细纲生成正文
  template: |
    你是一位专业小说作家。请基于以下场景大纲，生成正文内容。

    章节标题：{{chapterTitle}}
    场景大纲：{{sceneOutline}}
    上下文：{{context}}
    出场角色：{{characters}}
    类型：{{genre}}
    风格：{{style}}

    要求：
    - 字数 1500-2500 字
    - 有氛围感的开头
    - 符合角色人设的对话
    - 章节结尾留悬念
    - 每 300-500 字设置一个小爽点

# =============================================
# 续写 (continue_writing)
# =============================================
- id: continue_writing
  name: 续写
  description: 在现有文本基础上续写
  template: |
    请续写以下小说的下一段：

    {{text}}
    
    保持上文的风格和节奏。字数 500-800 字。

# =============================================
# 改写 (rewrite)
# =============================================
- id: rewrite
  name: 改写
  description: 按要求改写文本
  template: |
    请按照以下要求改写文本：

    原文：{{text}}
    改写要求：{{instruction}}

    保持原作的核心内容和风格。

# =============================================
# 扩写 (expand)
# =============================================
- id: expand
  name: 扩写
  description: 扩写指定段落
  template: |
    请扩写以下段落，丰富细节和氛围：

    {{text}}
    
    扩写方向：{{instruction}}
    目标字数：{{targetWords}} 字