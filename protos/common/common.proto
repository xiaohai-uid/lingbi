syntax = "proto3";
package lingbi.common;
option go_package = "github.com/xiaohai-uid/lingbi/protos/common";

message Empty {}

message UUID {
  string value = 1;
}

message Pagination {
  int32 page = 1;
  int32 page_size = 2;
}

message PaginatedResponse {
  int32 total = 1;
  int32 page = 2;
  int32 page_size = 3;
}